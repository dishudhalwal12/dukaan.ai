name: Verify Vercel Deploy Hook

on:
  push:
    branches: [feat/ui-enhancement]

jobs:
  verify:
    name: Verify Hook Secret
    runs-on: ubuntu-latest
    steps:
      - name: Validate Hook Secret Presence and Format
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "❌ ERROR: VERCEL_DEPLOY_HOOK is still empty."
            exit 1
          fi
          echo "✅ SUCCESS: VERCEL_DEPLOY_HOOK secret is present!"
          if [[ "$HOOK" == https://api.vercel.com/v1/integrations/deploy/* ]]; then
            echo "✅ SUCCESS: Hook URL format is valid."
          else
            echo "⚠️ Secret present, but format differs from standard Vercel deploy hook URL."
          fi
