  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nukkad — the corner shop, now answering on WhatsApp</title>

      content="AI-powered commerce for Indian shops: WhatsApp orders, stock and insights in one POS."

    <link rel="icon" type="image/svg+xml" href="/brand/nukkad-mark.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />

    <meta property="og:title" content="Nukkad — the corner shop, now answering on WhatsApp" />

      property="og:description"
      content="Take WhatsApp orders, track stock and see AI insights from one shopkeeper POS."
    />

    <meta

      content="Take WhatsApp orders, track stock and see AI insights from one shopkeeper POS."

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      One request for the seven languages this build ships. The old request asked
      for Manrope and "Noto Sans", which has no Devanagari, Gurmukhi, Gujarati,
      Tamil, Kannada or Arabic glyph: five of the seven languages rendered in the
      phone's own font. It also skipped weight 600, so every `font-semibold` was
      a synthesised bold. Keep this href identical to GOOGLE_FONTS_HREF in
      src/config/brand.ts, or the brand test fails.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Noto+Naskh+Arabic:wght@400..700&family=Noto+Sans+Devanagari:wght@400..800&family=Noto+Sans+Gujarati:wght@400..800&family=Noto+Sans+Gurmukhi:wght@400..800&family=Noto+Sans+Kannada:wght@400..800&family=Noto+Sans+Tamil:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                black: "#000000",
                dark: "#1A1A1A",
                accent: "#E6E6FA",
                accentHover: "#D8D8F0",
                // Deep accent for the light public pages. The pale accent above
                // is 1.23:1 on white and never goes there.
                accentInk: "#3A3E98",
                surfaceRaised: "#2D2D2D",
                // 4.66:1 on the raised surface. #737373 was 2.90:1 there.
                neutral: "#969696",
                light: "#F5F5F5",
                white: "#FFFFFF",
                success: "#4ADE80",
                warning: "#FBBF24",
                error: "#F87171",
              },
            },
            fontFamily: {
              // The full stack: Manrope draws Latin, the Noto families draw the
              // six scripts it cannot, and the browser picks per glyph.
              sans: [
                "Manrope",
                "Noto Naskh Arabic",
                "Noto Sans Devanagari",
                "Noto Sans Gujarati",
                "Noto Sans Gurmukhi",
                "Noto Sans Kannada",
                "Noto Sans Tamil",
                "system-ui",
                "-apple-system",
                "sans-serif",
              ],
              manrope: ["Manrope", "sans-serif"],
            },
            transitionDuration: {
              DEFAULT: "180ms",
            },
          },
        },
      };
    </script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        /* Manrope first, then one Noto family per script. Kept in step with
           FONT_STACK in src/config/brand.ts. */
        font-family:
          "Manrope", "Noto Naskh Arabic", "Noto Sans Devanagari", "Noto Sans Gujarati",
          "Noto Sans Gurmukhi", "Noto Sans Kannada", "Noto Sans Tamil", system-ui, -apple-system,
          sans-serif;
        overscroll-behavior: contain; /* Allows for a 'bounce' effect without triggering navigation or pull-to-refresh */
        overflow-x: hidden; /* Ensures horizontal content doesn't create a scrollbar */
        -webkit-font-smoothing: antialiased; /* Dark-on-black text needs this or stems look fatter */
      }
      /* Indic scripts carry marks above and below the headline stroke, so they
         need more leading than Latin at the same size. */
      :lang(hi),
      :lang(gu),
      :lang(pa),
      :lang(ta),
      :lang(kn),
      :lang(ur) {
        line-height: 1.7;
      }
      [dir="rtl"] .material-symbols-outlined {
        transform: scaleX(-1);
      }
      /* Prices and quantities line up in a column instead of drifting. */
      .tabular {
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes confetti-fall {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(120vh) rotate(720deg);
          opacity: 0;
        }
      }
      @keyframes sheen {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(200%);
        }
      }
    </style>
  </head>
  <body class="bg-black">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
